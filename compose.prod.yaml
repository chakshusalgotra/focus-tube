name: focustube-prod

services:
  app:
    build: .
    environment:
      ALLOWED_HOSTS: focustube.neuralnest.co.in
      AUTH_PUBLIC_ORIGINS: https://focustube.neuralnest.co.in
      TRUST_PROXY: "1"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      APP_ENV: production
      LOG_DIRECTORY: /app/logs
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      METRICS_ALLOWED_ADDRESSES: ${METRICS_ALLOWED_ADDRESSES:-127.0.0.1,::1}
      GRAFANA_DASHBOARD_URL: ${GRAFANA_DASHBOARD_URL:-}
      UPTIME_DASHBOARD_URL: ${UPTIME_DASHBOARD_URL:-}
    ports:
      # Cloudflare tunnel ingress: focustube.neuralnest.co.in -> localhost:3003
      - "127.0.0.1:3003:3000"
    volumes:
      - focustube-data:/app/data
      - focustube-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('https://focustube.neuralnest.co.in/api/health', { signal: AbortSignal.timeout(4000) }).then(async response => { if (!response.ok || (await response.json()).database !== 'ok') process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  # Namespaced by project name -> focustube-prod_focustube-data (separate DB from dev)
  focustube-data:
  focustube-logs: